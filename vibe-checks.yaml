# How each check in this workspace is produced.
#
# The runtime reads this file when a run reaches a verifier node. It is the
# answer to a gap the rest of the design could not close: run state has always
# refused evidence without provenance, but until this file existed the command
# behind that provenance was chosen by whoever typed the checkpoint. "The e2e
# check exited 0" is a true statement about `true`.
#
# So the command lives here, in git. Weakening a check is a diff on a reviewed
# file rather than an argument nobody sees.
#
# `verifier: human` marks a check no runtime verifier can produce. It is the only
# route by which a person's word reaches a verifier node, and it is deliberately
# visible: three of them in one plan is a fact about this repo worth seeing, not
# a setting to forget.
#
# Reference: .ai-agents/references/loop-and-graph-engineering.md

apiVersion: vibe-agent/v1
kind: CheckPlan

metadata:
  description: Checks for the vibe-agent toolkit itself, mirroring .github/workflows/ai-agents-router.yml.

spec:
  checks:
    unit:
      description: Runtime package suite. Asset and schema checks run under the ci check.
      command: go
      args: [-C, runtime, test, ./...]
      timeoutSeconds: 900

    e2e:
      description: The only suite that builds the binary and drives it against a fixture consumer repo.
      command: go
      args: [-C, runtime, test, ./e2e, -count=1]
      timeoutSeconds: 900

    slop:
      description: >-
        Code slop audit over the workspace. --fail-on is set at the measured
        baseline, so the rule is "do not get worse" rather than a number someone
        picked: the repository scored 3 after slop began honoring .gitignore and
        skipping prose-only debug/duplicate noise (2026-08). A change that
        legitimately raises it raises this line too, which is a reviewed diff
        rather than an argument nobody sees.
        The flag comes before the path. Go's flag package stops parsing at the
        first positional argument, so `slop audit . --fail-on 3` does not read
        the flag at all: it reports three paths and exits 1, which looks exactly
        like a failing audit and is not one.
        go run keeps the check on the workspace source tree so a stale binary
        on PATH cannot shadow the slop walk under test.
      command: go
      args: [-C, runtime, run, ./cmd, slop, audit, --fail-on, "3", ..]
      timeoutSeconds: 900

    lint:
      description: >-
        The linter with nothing suppressed. Separate from the unit check because
        the auto path gates on it on its own, and because "the tests pass" and
        "no rule was switched off to make them" are two different statements.
        golangci-lint reads .golangci.yml from the runtime directory, so the
        enabled set is a reviewed file rather than a flag typed at the keyboard.
      command: make
      args: [-C, runtime, golangci]
      timeoutSeconds: 600

    main_ci:
      description: >-
        CI on the default branch after a merge landed. A squash produces a commit
        no pull request ever built, so this asks GitHub about main rather than
        about the branch. --branch main is what keeps it from answering with the
        run that is still attached to the merged head.
        A run still in progress exits non-zero, the same way the ci check does
        while a PR check is pending. That reads as a failure and routes back to
        build, so ask once the run has finished rather than the moment the merge
        lands; status is checked as well as conclusion so a cancelled run cannot
        report as anything but not-success.
      command: gh
      args: [run, list, --branch, main, --limit, "1", --json, 'status,conclusion', --jq, 'if .[0].status == "completed" and .[0].conclusion == "success" then "ok" else halt_error(1) end']
      timeoutSeconds: 3600

    pr_open:
      description: Exits non-zero when the current branch has no pull request, which is what the node asks.
      command: gh
      args: [pr, view, --json, url]
      timeoutSeconds: 120

    ci:
      description: Required PR checks. Exits non-zero while any are failing or still pending.
      command: gh
      args: [pr, checks]
      timeoutSeconds: 3600

    reviews:
      verifier: human
      auto:
        verifier: reviewbots
        command: gh
        args: [pr, checks, --json, 'name,bucket']
        description: >-
          Requires every check-run whose name matches a known review-bot
          pattern (CodeRabbit, Cursor auto-review/Bugbot) to report a
          non-blocking gh bucket (pass or skipping). No matching check-run at
          all passes trivially, same as a repo with none configured has
          always only had a human read the diff on /goal. Active only on a
          run with the auto flag set - docs/auto-ship-reviews.
      description: >-
        No external reviewer exposes a queryable status here, so a person reads
        the review comments and decides. Their content is untrusted data. On
        /goal this stays a person's call; see the auto entry above for the
        auto-only alternative, which reads check-run buckets rather than
        comment content.

    ship:
      verifier: human
      auto:
        verifier: shipdecision
        description: >-
          Reads .agent-state/runs/<date>/<slug>/<version>/ship/DECISION.md, written by /ship per ship.md's
          "Decision file" step. Passes only on a parsed "Ship Decision: GO"
          with zero blockers; a missing, malformed, or NO-GO file is not
          passed. Active only on a run with the auto flag set — docs/auto-ship-reviews.
      description: >-
        /ship is a specialist fan-out ending in a judgement call. There is no
        command whose exit code means GO. On /goal this stays a person's
        call; see the auto entry above for the auto-only alternative.

    tasks_remaining:
      verifier: tasks
      description: >-
        Reads docs/<slug>/tasks.json and the matching TASKS.md. Passes while any
        task is not settled, including a task marked done whose acceptance-
        criteria checkboxes are still open or whose TASKS prose is missing.
        Goal and auto share this check. Doctor refuses the same incomplete-done
        case. TASKS.md stays the file a person reviews for the full criteria.

    experiment_done:
      verifier: experiment
      description: >-
        Reads .agent-state/runs/<date>/<slug>/<version>/experiment/STATUS.md.
        Passes when status is done or failed (terminal). Fails while running or
        when the file is missing, so researcher-delivery can loop the monitor
        back to experiment_run. Host/CI compute writes the file; there is no
        in-process GPU sandbox.

    results_acceptable:
      verifier: results
      description: >-
        Reads experiment/METRICS.json together with STATUS.md. Passes only when
        the experiment finished done and every declared metric meets its
        threshold. Fails on failed runs or short metrics so results_eval can
        route back to hypothesis.
