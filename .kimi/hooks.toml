# Copy these [[hooks]] blocks into ~/.kimi/config.toml (Kimi reads user config only).

[[hooks]]
event = "PreToolUse"
matcher = "Shell|WriteFile|EditFile|MultiEdit|FetchURL|SearchWeb"
command = "vibe-agent hook pre-tool-use --client kimi"
timeout = 30

[[hooks]]
event = "PostToolUse"
matcher = "Shell|WriteFile|EditFile|MultiEdit|FetchURL|SearchWeb"
command = "vibe-agent hook post-tool-use --client kimi"
timeout = 30

[[hooks]]
event = "Stop"
command = "vibe-agent hook stop --client kimi"
timeout = 30
