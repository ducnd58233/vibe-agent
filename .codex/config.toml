#:schema https://developers.openai.com/codex/config-schema.json
#
# Project-scoped Codex configuration (loaded when the project is trusted).
# See https://developers.openai.com/codex/config-reference

# Same domain-agnostic toolkit narrative as other tools; see https://developers.openai.com/codex/config-reference#instruction-overrides
# Relative to this file's directory (.codex/); repo charter lives at workspace root.
model_instructions_file = "../AGENTS.md"

# Subagent fan-out defaults; custom agents are generated under .codex/agents/ by scripts/link-ai-agents.*
[agents]
max_threads = 8
max_depth = 1

# Outer-loop control plane over MCP: model-decided, so best effort. The
# deterministic surface is hooks.json beside this file, which Codex loads only
# for a project marked trusted below.
#
# One gap is the host's, not this config's: codex-cli 0.147.0 fires PostToolUse
# on success only and publishes no failure event, so a failed command cannot be
# journalled on Codex the way it is on Claude and Cursor.
#
# Requires the vibe-agent binary on PATH; without it Codex simply sees no tools.
[mcp_servers.vibe-agent]
command = "vibe-agent"
args = ["mcp", "serve"]
