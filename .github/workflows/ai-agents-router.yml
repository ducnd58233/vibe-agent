name: AI agents assets check

on:
  push:
    paths:
      - '.ai-agents/**'
      - '.vibe-agent/.ai-agents/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'vibe-checks.yaml'
      - '.gitignore'
      - '.github/workflows/ai-agents-router.yml'
  pull_request:
    paths:
      - '.ai-agents/**'
      - '.vibe-agent/.ai-agents/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'vibe-checks.yaml'
      - '.gitignore'
      - '.github/workflows/ai-agents-router.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test link script (symlinks to .ai-agents)
        run: |
          bash scripts/link-ai-agents.sh
          test -L .claude/skills
          test -L .cursor/skills
          test -L .opencode/agents

      - name: Verify ROUTER.md tables match folder contents
        run: bash scripts/check-ai-agents-routers.sh

      - name: Check XML section tags
        run: bash scripts/check-xml-tags.sh

      - name: Check generated harness views
        run: bash scripts/check-generated-views.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install check dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Verify asset frontmatter parses
        run: python3 scripts/check-frontmatter.py

      - name: Verify JSON Schema contracts
        run: python3 scripts/check-schemas.py

      - name: Verify workflow graphs
        run: python3 scripts/check-graphs.py

      - name: Verify the graph checker rejects broken graphs
        run: python3 scripts/check-graphs-test.py

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod

      - name: Vet and test the runtime
        working-directory: runtime
        run: |
          go vet ./...
          go test ./...

      - name: Check runtime formatting
        working-directory: runtime
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Cross-compile every release target
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd
            echo "built $target"
          done
