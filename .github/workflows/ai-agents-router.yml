name: AI agents assets check
# bumped to retrigger path-filtered PR checks for #163

on:
  # main only. A push to any other branch with a pull request open fires both
  # events, and the two runs check the same commit with the same steps: one is
  # pure cost, and on a red build it is two failures to read for one problem.
  # Branch work is covered by pull_request; main is covered here because a merge
  # or a direct push has no pull request of its own.
  #
  # The path list is anchored rather than written twice. Two copies is two things
  # to update, and the copy that goes stale is the one that stops running a
  # check. The anchor lives on a key the workflow schema already defines, since a
  # top-level key of its own would not validate.
  push:
    branches: [main]
    paths: &paths
      - '.ai-agents/**'
      - '.vibe-agent/.ai-agents/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'vibe-checks.yaml'
      - '.gitignore'
      # Every workflow, not just this one. Naming a single file meant a change
      # to the release workflow opened a pull request with no check on it at
      # all - which is how a version-derivation bug reached a published
      # release: nothing ran on the commit that introduced it.
      - '.github/workflows/**'
      # Host config. These were left out, so a change to a permission rule, a
      # hook wiring, or a rules file opened a pull request with no required
      # check on it at all: #74 changed permissions for two hosts and CI never
      # ran. They are the directories where a mistake is silent - a permission
      # that no longer applies, or a hook that stops firing, produces no error
      # anywhere - which is the argument for covering them, not against.
      - '.claude/**'
      - '.cursor/**'
      - '.codex/**'
      - '.opencode/**'
      - 'opencode.json'
  pull_request:
    paths: *paths

# A new push supersedes the run in flight. The older one can only report on code
# nobody will merge.
concurrency:
  group: assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # runtime-version.sh reads commits since runtime/v*; depth 1 makes
          # that tag look like a non-ancestor and yields a broken version.
          fetch-depth: 0

      - name: Smoke test link script (symlinks to .ai-agents)
        run: |
          bash scripts/link-ai-agents.sh
          test -L .claude/skills
          test -L .cursor/skills
          test -L .opencode/agents

      - name: Verify ROUTER.md tables match folder contents
        run: bash scripts/check-ai-agents-routers.sh

      - name: Check XML section tags
        run: bash scripts/check-xml-tags.sh

      - name: Check generated harness views
        run: bash scripts/check-generated-views.sh

      - name: Check workspace install wiring
        run: bash scripts/check-workspace-install.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install check dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Verify asset frontmatter parses
        run: python3 scripts/check-frontmatter.py

      - name: Verify JSON Schema contracts
        run: python3 scripts/check-schemas.py

      - name: Verify workflow graphs
        run: python3 scripts/check-graphs.py

      - name: Verify the graph checker rejects broken graphs
        run: python3 scripts/check-graphs-test.py

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod

      - name: Verify docs layout checker fixtures
        run: bash scripts/check-docs-layout.sh

      - name: Verify runtime release version derivation
        run: bash scripts/check-runtime-version.sh

      # golangci-lint is installed on demand into runtime/bin by `make tools`.
      # Caching on the Makefile and go.sum means a run that changed neither
      # skips the install entirely.
      - name: Cache the pinned linter
        uses: actions/cache@v4
        with:
          path: runtime/bin
          key: gotools-${{ runner.os }}-${{ hashFiles('runtime/Makefile', 'runtime/go.sum') }}

      # `make check` is gofmt, vet, golangci-lint and the tests. Spelled out
      # here it would be a second copy of the rules, and the copy that drifts is
      # the one deciding whether a pull request merges. The Makefile is where a
      # command is decided; this file decides only when to run one.
      - name: Check the runtime
        run: make -C runtime check

      - name: Cross-compile every release target
        if: github.event_name == 'pull_request'
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd
            echo "built $target"
          done
